[project]
name = "tendersense-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.69,<1",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pymongo>=4.15,<5",
  "sentence-transformers>=5.1,<6",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
