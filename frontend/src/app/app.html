<header>
  <a routerLink="/" class="brand"><strong>TenderSense</strong><span> BracIT opportunity desk</span></a>
  @if (loggedIn()) {
    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <a routerLink="/upload" routerLinkActive="active">Upload</a>
      <button class="ghost" (click)="logout()">Sign out</button>
    </nav>
  }
</header>

@if (!loggedIn()) {
  <main class="login card">
    @if (error()) { <div class="notice">{{ error() }}</div> }
    <h1>Sign in</h1>
    <p>Review procurement opportunities matched to BracIT capabilities.</p>
    <form (ngSubmit)="login()">
      <label>Email<input name="email" type="email" [(ngModel)]="email" required></label>
      <label>Password<input name="password" type="password" [(ngModel)]="password" required></label>
      <button class="primary">Sign in</button>
    </form>
  </main>
} @else {
  <router-outlet />
}
